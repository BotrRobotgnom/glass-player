# Builds the app and creates a DRAFT release when a tag like v0.2.5 is pushed.
# The draft becomes public (and visible to auto-update) only after you press Publish on the Releases page.
#
# How it avoids the "two drafts / wrong tag / files mixed between versions" problems:
#   1. ONE job (draft) creates the draft, with the description built from CHANGELOG.md, and passes its id on.
#   2. The build jobs only build and upload files to THAT id. electron-builder never searches for or creates a release
#      (--publish never), so it cannot pick up another version's draft or create duplicates.
#   3. Nothing here touches git tags, and a release that is already published is never modified.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# the same tag never runs twice at once (a re-run waits instead of racing)
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # tags of releases that are already public (drafts and pre-releases excluded); empty for the first release
          PUBLISHED=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | paste -sd, - || true)
          echo "Published releases: ${PUBLISHED:-none}"
          node scripts/release-notes.mjs "$TAG" --published "$PUBLISHED" > notes.md
          cat notes.md
      - name: Create (or reuse) the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A release of this exact version, found by tag name or by title (a draft may be listed as "untagged-...")
          FOUND=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\" or .name==\"$TAG\") | \"\(.id) \(.draft)\"" | head -n1)
          if [ -n "$FOUND" ]; then
            ID=${FOUND% *}
            DRAFT=${FOUND#* }
            if [ "$DRAFT" != "true" ]; then
              echo "::error::$TAG is already published. Published releases are never changed."
              exit 1
            fi
            echo "Reusing the existing draft $ID"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F body=@notes.md > /dev/null
          else
            ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -F body=@notes.md --jq .id)
            echo "Created draft $ID"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  windows:
    needs: draft
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: bash scripts/upload-assets.sh dist/Silverpane-Setup-*.exe dist/Silverpane-Setup-*.exe.blockmap dist/Silverpane-Portable-*.exe dist/latest.yml

  linux:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux --publish never
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: bash scripts/upload-assets.sh dist/Silverpane-*.AppImage dist/latest-linux.yml
