# Builds and creates a draft release when a tag like v0.0.2 is pushed, then fills in its description
# from CHANGELOG.md (scripts/release-notes.mjs).
# The release is a DRAFT: it becomes public (and visible to auto-update) only after
# you press Publish on the Releases page.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The description comes from CHANGELOG.md: this version's section, plus the sections of earlier
  # versions that were never published (all of them for the very first release).
  notes:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # tags of releases that are already public (drafts and pre-releases excluded); empty for the first release
          PUBLISHED=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | paste -sd, - || true)
          echo "Published releases: ${PUBLISHED:-none}"
          node scripts/release-notes.mjs "$TAG" --published "$PUBLISHED" > notes.md
          cat notes.md
      - name: Put the notes into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # gh can't look a draft up by tag, so find its id through the API
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          if [ -z "$ID" ]; then echo "No release found for $TAG"; exit 1; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F body=@notes.md
